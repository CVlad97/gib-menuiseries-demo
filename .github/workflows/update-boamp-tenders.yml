name: Update BOAMP tenders

on:
  workflow_dispatch:
  schedule:
    - cron: '15 9 * * 1-5'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run fetch:boamp
      - run: npm run build:prospection
      - name: Commit BOAMP data
        run: |
          if git diff --quiet -- public/data/gib/boamp-tenders.json public/data/gib/prospecting-automation.json; then
            echo "No BOAMP/prospecting changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/gib/boamp-tenders.json public/data/gib/prospecting-automation.json
          git commit -m "chore: update BOAMP tender feed"
          git push
